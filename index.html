<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RICKY'S GROCERY STORE - POS</title>
<style>
  *{box-sizing:border-box;font-family:Inter,system-ui,Arial,sans-serif}
  body{margin:0;background:#FFF8F0;color:#2b0f14}

  /* ===== LOGO SCREEN ===== */
  #logoScreen{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#8A1420,#4A0810);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center;padding:20px}
  #logoScreen img{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid #D4AF37;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#fff}
  #logoScreen h1{color:#fff;font-size:42px;letter-spacing:2px;margin:18px 0 2px;line-height:1}
  #logoScreen p{color:#FFD700;letter-spacing:6px;font-size:14px;margin:0 0 26px;font-weight:700}
  .logo-btn{width:280px;max-width:90%;padding:16px;border-radius:999px;border:3px solid #D4AF37;font-size:17px;font-weight:900;cursor:pointer;margin:6px 0}
  .btn-gold{background:linear-gradient(#FFD700,#D4AF37);color:#4A0810;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .btn-maroon{background:#6B0F1A;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .btn-white{background:#fff;color:#6B0F1A}
  .logo-footer{color:#ffffffaa;font-size:12px;margin-top:20px}

  /* ===== POS ===== */
  header{background:#6B0F1A;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.2)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid #D4AF37;background:#fff}
  .logo b{font-size:22px;letter-spacing:1px;line-height:1}
  .logo small{color:#FFD700;letter-spacing:4px;font-size:11px}
  .top-actions button{background:#D4AF37;border:none;padding:10px 14px;border-radius:999px;font-weight:800;cursor:pointer}
  .wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;max-width:1400px;margin:auto}
  .search{width:100%;padding:14px 16px;border:2px solid #E8D5B5;border-radius:14px;font-size:16px;outline:none}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .cats button{padding:9px 14px;border-radius:999px;border:1px solid #E8D5B5;background:#fff;cursor:pointer;font-weight:700}
  .cats button.active{background:#6B0F1A;color:#fff;border-color:#6B0F1A}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #F0E2C8;border-radius:16px;padding:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .card:hover{transform:translateY(-2px);border-color:#D4AF37}
  .card .img{height:72px;border-radius:12px;background:#FFF2CC;display:grid;place-items:center;font-size:36px}
  .card h3{margin:10px 0 4px;font-size:15px}
  .card p{margin:0;color:#777;font-size:12px}
  .price{margin-top:8px;display:flex;justify-content:space-between;align-items:center}
  .price b{color:#6B0F1A;font-size:17px}
  .price span{background:#6B0F1A;color:#fff;padding:6px 10px;border-radius:999px;font-size:12px}
  .cart{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.1);height:fit-content;position:sticky;top:90px}
  .totals div{display:flex;justify-content:space-between;padding:5px 0}
  .totals .grand{font-size:20px;font-weight:900;color:#6B0F1A;border-top:2px solid #D4AF37;padding-top:10px}
  .pay{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pay button{padding:13px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
  .cash{background:#6B0F1A;color:#fff}.cardpay{background:#D4AF37}
  .checkout{width:100%;margin-top:10px;padding:15px;background:#111;color:#fff;border:none;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer}
  .cash-input{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;margin-top:10px;font-size:16px}
  .qty{display:flex;gap:6px;align-items:center}
  .qty button{width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:800}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #eee}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}.cart{position:static} #logoScreen h1{font-size:32px} #logoScreen img{width:180px;height:180px}}
  @media print{body *{visibility:hidden} #receipt,#receipt *{visibility:visible} #receipt{position:absolute;left:0;top:0;width:100%} #logoScreen{display:none!important}}
</style>
</head>
<body>

<!-- ===== LOGO SCREEN WITH BUTTONS EXACTLY LIKE LOGO ===== -->
<div id="logoScreen">
  <img src="store-logo.png" alt="RICKY'S GROCERY STORE">
  <h1>RICKY'S</h1>
  <p>GROCERY STORE</p>

  <button class="logo-btn btn-gold" onclick="openPOS()">🛒 START SELLING</button>
  <button class="logo-btn btn-maroon" onclick="openPOS('Soft Drinks 2L')">🥤 SOFT DRINKS 2L</button>
  <button class="logo-btn btn-white" onclick="openPOS('Water 1.5L')">💧 WATER 1.5L</button>
  <button class="logo-btn btn-white" onclick="openPOS('Juice & More')">🧃 JUICE & MORE</button>

  <div class="logo-footer">Mbombela • RICKY'S GROCERY STORE • Classy & Fast POS</div>
</div>

<!-- ===== POS ===== -->
<header>
  <div class="logo">
    <img src="store-logo.png" alt="RICKY'S GROCERY STORE" onclick="showLogoScreen()" style="cursor:pointer">
    <div><b>RICKY'S</b><br><small>GROCERY STORE</small></div>
  </div>
  <div class="top-actions">
    <button onclick="showLogoScreen()">🏠 HOME</button>
    <button onclick="window.print()">🧾 PRINT RECEIPT</button>
  </div>
</header>

<div class="wrap">
  <div>
    <input class="search" id="search" placeholder="Search drink or scan barcode... e.g. Coke 2L, Water 1.5L" oninput="render()">
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
    <p style="color:#888;font-size:13px">💡 Tap the logo on top left to go back to Logo Screen.</p>
  </div>

  <div class="cart">
    <h2>🧺 Current Sale <span id="count"></span></h2>
    <div id="cartItems"><p style="color:#999">Cart is empty. Tap a drink to add.</p></div>
    <input class="cash-input" id="cashGiven" type="number" placeholder="Cash given (R)" oninput="render()">
    <div class="totals">
      <div><span>Subtotal</span><b id="sub">R 0.00</b></div>
      <div><span>VAT (15% incl.)</span><b id="vat">R 0.00</b></div>
      <div><span>Change</span><b id="change">R 0.00</b></div>
      <div class="grand"><span>TOTAL</span><span id="total">R 0.00</span></div>
    </div>
    <div class="pay">
      <button class="cash" onclick="setPay('CASH')">💵 CASH</button>
      <button class="cardpay" onclick="setPay('CARD')">💳 CARD</button>
    </div>
    <button class="checkout" onclick="checkout()">✅ COMPLETE SALE • OPEN DRAWER</button>
    <p id="payLabel" style="text-align:center;font-weight:700;color:#6B0F1A">Payment: CASH</p>
  </div>
</div>

<div id="receipt" style="display:none"></div>

<script>
function openPOS(cat){
  if(cat) activeCat=cat;
  document.getElementById('logoScreen').style.display='none';
  render();
}
function showLogoScreen(){ document.getElementById('logoScreen').style.display='flex'; }
