<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RICKY'S GROCERY STORE - POS</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#D6EAF8}
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#8A1420,#4A0810);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;text-align:center}
#splash img{width:230px;height:230px;border-radius:50%;object-fit:cover;border:6px solid #D4AF37;background:#fff}
#splash h1{color:#fff;font-size:48px;margin:16px 0 2px;letter-spacing:2px}
#splash p{color:#FFD700;letter-spacing:7px;font-weight:700;margin:0}
#splash .load{width:260px;height:10px;background:#ffffff33;border-radius:99px;margin-top:24px;overflow:hidden}
#splash .load div{height:100%;width:0%;background:#FFD700}
.topbar{background:linear-gradient(90deg,#1A3A8F,#2E86C1,#27AE60);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.top-left{display:flex;align-items:center;gap:10px}
.top-left img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid #D4AF37;background:#fff;cursor:pointer}
.top-left b{font-size:22px;letter-spacing:1px;line-height:1}
.top-left small{color:#FFD700;font-size:11px}
.top-right{text-align:right;font-size:12px}
.top-right div{font-weight:700}
.top-btns{display:flex;gap:6px;margin-top:4px;justify-content:flex-end}
.top-btns button{border:none;padding:7px 12px;border-radius:8px;font-weight:800;cursor:pointer}
.mng{background:#F39C12;color:#fff;border:2px solid #fff!important}.day{background:#B7950B;color:#fff}.out{background:#C0392B;color:#fff}
.scanbar{background:#EAF2F8;padding:10px;display:flex;gap:10px}
.scanbar input{flex:1;padding:13px;border:2px solid #AED6F1;border-radius:8px;font-size:16px}
.scanbar button{padding:0 22px;border:none;border-radius:8px;font-weight:900;cursor:pointer;background:linear-gradient(#FDEBD0,#F5CBA7)}
.cats{background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:2px solid #ddd}
.cats button{padding:10px 16px;border-radius:99px;border:1px solid #AED6F1;background:#EBF5FB;font-weight:800;cursor:pointer}
.cats button.active{background:#1A3A8F;color:#fff}
.main{display:grid;grid-template-columns:1fr 380px;gap:10px;padding:10px;align-items:start}
.left{background:#fff;border-radius:10px;padding:12px;min-height:600px}
.left h3{margin:0 0 10px;color:#1A3A8F}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{border:2px solid #AED6F1;border-radius:12px;overflow:hidden;background:#fff}
.card.sel{border-color:#27AE60;box-shadow:0 0 0 3px #A9DFBF}
.card .img{height:110px;background:#111;display:grid;place-items:center;font-size:52px;color:#fff}
.card .body{padding:10px}
.card small{color:#2E86C1;font-size:12px}
.card b{font-size:14px;display:block;margin:4px 0}
.card .price{color:#2E86C1;font-weight:900;font-size:19px}
.barcode{border:1px dashed #999;text-align:center;padding:6px;margin:8px 0;font-family:monospace;font-size:11px}
.barcode div{font-size:22px;letter-spacing:2px}
.card button{width:100%;padding:11px;border:none;border-radius:8px;background:linear-gradient(#FDEBD0,#F5CBA7);font-weight:900;cursor:pointer}
.right{background:#fff;border-radius:10px;padding:14px;position:sticky;top:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.right .rlogo{text-align:center}
.right .rlogo img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #D4AF37}
.right h2{text-align:center;color:#1A3A8F;margin:6px 0 0;font-size:16px}
.right p{text-align:center;margin:2px 0;color:#555;font-size:12px}
.right h3{text-align:center;color:#2E86C1;margin:8px 0}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0}
.qtybtns{display:flex;gap:4px;align-items:center}
.qtybtns button{width:30px;height:30px;border-radius:50%;border:none;background:#2E86C1;color:#fff;font-weight:900;cursor:pointer}
.qtybtns button.x{background:#E74C3C}
.total-row{display:flex;justify-content:space-between;margin:12px 0}
.total-row b{font-size:22px;color:#1A3A8F}
.right input,.right select{width:100%;padding:12px;margin:5px 0;border:2px solid #AED6F1;border-radius:8px;font-size:15px}
.checkout{width:100%;padding:15px;background:#1AB0D6;color:#fff;border:none;border-radius:8px;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}
@media(max-width:900px){.main{grid-template-columns:1fr}.right{position:static}}
@media print{body *{visibility:hidden} #receipt,#receipt *{visibility:visible} #receipt{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="splash" onclick="enterPOS()">
  <img src="store-logo.png"><h1>RICKY'S</h1><p>GROCERY STORE</p>
  <div class="load"><div id="loadBar"></div></div><small style="color:#fff;margin-top:12px">Loading POS... Tap to enter</small>
</div>
<div class="topbar">
  <div class="top-left" onclick="location.reload()"><img src="store-logo.png"><div><b>RICKY'S</b><br><small>Mbombela Branch • ZA SOUTH AFRICA</small></div></div>
  <div class="top-right"><div id="clock">2026/11/27</div><div>Cashier: shai</div>
    <div class="top-btns"><button class="mng" onclick="alert('Management: Today R '+salesTotal().toFixed(2))">MANAGEMENT</button><button class="day" onclick="dayEnd()">DAY END</button><button class="out" onclick="location.reload()">LOGOUT</button></div>
  </div>
</div>
<div class="scanbar"><input id="search" placeholder="SCAN / TYPE BARCODE + Enter" oninput="render()" onkeydown="if(event.key==='Enter'){scanCode(this.value)}"><button onclick="scanCode(document.getElementById('search').value)">SCAN +</button><button onclick="alert('Cash Drawer Opened')">CASH DRAWER</button></div>
<div class="cats" id="cats"></div>
<div class="main">
  <div class="left"><h3 id="catTitle">Soft Drinks</h3><div class="grid" id="grid"></div></div>
  <div class="right">
    <div class="rlogo"><img src="store-logo.png"></div><h2>RICKY'S</h2><p>Mbombela Branch • ZA SOUTH AFRICA</p><h3>CURRENT SALE</h3><p id="orderNo"></p>
    <div id="cartItems"><p style="color:#999;text-align:center">No items yet.<br>Tap ADD + on left.</p></div>
    <div class="total-row"><b>TOTAL</b><b id="total">R0</b></div>
    <select id="payMethod"><option>Cash</option><option>Card</option><option>EFT</option><option>SnapScan</option></select>
    <input id="cashGiven" type="number" placeholder="Cash given" oninput="render()">
    <div style="display:flex;justify-content:space-between;font-weight:800"><span>Change:</span><span id="change">R 0.00</span></div>
    <input placeholder="Customer name / phone (optional)"><input placeholder="Extra - if you forgot something">
    <button class="checkout" onclick="checkout()">CHECKOUT & PRINT</button>
    <p>VAT 15% incl: <b id="vat">R 0.00</b> • <span id="itemCount"></span></p>
  </div>
</div>
<div id="receipt" style="display:none"></div>
<script>
let products=[

 {id:8,name:"Sparletta Creme Soda 2L",price:29.99,cat:"Soft Drinks",emoji:"🥤",code:"6001108",stock:40},
 {id:9,name:"Twist Lemon 2L",price:32.99,cat:"Soft Drinks",emoji:"🍋",code:"6001109",stock:50},
 {id:10,name:"Appletiser 1.25L",price:36.99,cat:"Soft Drinks",emoji:"🍎",code:"6001110",stock:30},
 {id:11,name:"Pepsi 2L",price:29.99,cat:"Soft Drinks",emoji:"🥤",code:"6001112",stock:50},
 {id:12,name:"Monster Energy 500ml",price:24.99,cat:"Soft Drinks",emoji:"⚡",code:"6001135",stock:60},
 {id:13,name:"Red Bull 250ml",price:29.99,cat:"Soft Drinks",emoji:"⚡",code:"6001136",stock:60},
 {id:14,name:"Powerade 500ml",price:19.99,cat:"Soft Drinks",emoji:"🏃",code:"6001137",stock:50},
 {id:15,name:"Ice Tea Peach 1.5L",price:28.99,cat:"Soft Drinks",emoji:"🍑",code:"6001139",stock:40},
 {id:20,name:"White Bread Loaf",price:18.99,cat:"Grocery",emoji:"🍞",code:"6002001",stock:30},
 {id:21,name:"Brown Bread Loaf",price:19.99,cat:"Grocery",emoji:"🍞",code:"6002002",stock:30},
 {id:22,name:"Maize Meal 5kg",price:89.99,cat:"Grocery",emoji:"🌽",code:"6002003",stock:20},
 {id:23,name:"Rice 5kg",price:109.99,cat:"Grocery",emoji:"🍚",code:"6002004",stock:20},
 {id:24,name:"Sugar 2kg",price:49.99,cat:"Grocery",emoji:"🧂",code:"6002005",stock:25},
 {id:25,name:"Cooking Oil 2L",price:89.99,cat:"Grocery",emoji:"🫒",code:"6002006",stock:20},
 {id:26,name:"Baked Beans 410g",price:19.99,cat:"Grocery",emoji:"🥫",code:"6002007",stock:60},
 {id:27,name:"Tinned Fish 400g",price:29.99,cat:"Grocery",emoji:"🐟",code:"6002008",stock:40},
 {id:28,name:"Noodles Pack",price:12.99,cat:"Grocery",emoji:"🍜",code:"6002009",stock:80},
 {id:29,name:"Tea Bags 100s",price:59.99,cat:"Grocery",emoji:"☕",code:"6002010",stock:30},
 {id:30,name:"Coffee 250g",price:89.99,cat:"Grocery",emoji:"☕",code:"6002011",stock:20},
 {id:31,name:"Milk 2L",price:39.99,cat:"Grocery",emoji:"🥛",code:"6002012",stock:25},
 {id:32,name:"Eggs 30s",price:89.99,cat:"Grocery",emoji:"🥚",code:"6002013",stock:20},
 {id:40,name:"Bananas 1kg",price:19.99,cat:"Fruits & Vegetables",emoji:"🍌",code:"6003001",stock:40},
 {id:41,name:"Apples 1kg",price:29.99,cat:"Fruits & Vegetables",emoji:"🍎",code:"6003002",stock:40},
 {id:42,name:"Oranges 1kg",price:24.99,cat:"Fruits & Vegetables",emoji:"🍊",code:"6003003",stock:40},
 {id:43,name:"Potatoes 5kg",price:59.99,cat:"Fruits & Vegetables",emoji:"🥔",code:"6003004",stock:30},
 {id:44,name:"Onions 2kg",price:29.99,cat:"Fruits & Vegetables",emoji:"🧅",code:"6003005",stock:30},
 {id:45,name:"Tomatoes 1kg",price:24.99,cat:"Fruits & Vegetables",emoji:"🍅",code:"6003006",stock:30},
 {id:46,name:"Cabbage Each",price:19.99,cat:"Fruits & Vegetables",emoji:"🥬",code:"6003007",stock:25},
 {id:47,name:"Spinach Bunch",price:14.99,cat:"Fruits & Vegetables",emoji:"🥬",code:"6003008",stock:25},
 {id:48,name:"Carrots 1kg",price:19.99,cat:"Fruits & Vegetables",emoji:"🥕",code:"6003009",stock:30},
 {id:49,name:"Butternut Each",price:24.99,cat:"Fruits & Vegetables",emoji:"🎃",code:"6003010",stock:20},
 {id:60,name:"Aquelle Water 1.5L",price:14.99,cat:"Water",emoji:"💧",code:"6001120",stock:80},
 {id:61,name:"Valpre Water 1.5L",price:17.99,cat:"Water",emoji:"💧",code:"6001121",stock:80},
 {id:62,name:"Bonaqua Water 1.5L",price:15.99,cat:"Water",emoji:"💧",code:"6001122",stock:80},
 {id:70,name:"Extension Cord 5m",price:149.99,cat:"Electric Equipment",emoji:"🔌",code:"6004001",stock:15},
 {id:71,name:"LED Bulb 9W",price:39.99,cat:"Electric Equipment",emoji:"💡",code:"6004002",stock:50},
 {id:72,name:"2-Pin Plug",price:24.99,cat:"Electric Equipment",emoji:"🔌",code:"6004003",stock:40},
 {id:73,name:"Multi Plug Adapter",price:89.99,cat:"Electric Equipment",emoji:"🔌",code:"6004004",stock:20},
 {id:74,name:"Kettle 1.7L",price:299.99,cat:"Electric Equipment",emoji:"🫖",code:"6004005",stock:10},
 {id:75,name:"2-Plate Stove",price:399.99,cat:"Electric Equipment",emoji:"🔥",code:"6004006",stock:8},
 {id:76,name:"Rechargeable Torch",price:129.99,cat:"Electric Equipment",emoji:"🔦",code:"6004007",stock:15},
 {id:77,name:"Batteries AA 4-Pack",price:49.99,cat:"Electric Equipment",emoji:"🔋",code:"6004008",stock:40},
 {id:80,name:"Oros Orange 2L",price:44.99,cat:"Juice & More",emoji:"🍊",code:"6001130",stock:30},
 {id:81,name:"Ceres Juice 1L",price:29.99,cat:"Juice & More",emoji:"🧃",code:"6001131",stock:30},
 {id:82,name:"Tropika 1.5L",price:34.99,cat:"Juice & More",emoji:"🥭",code:"6001132",stock:30},
 {id:83,name:"Mageu 2L",price:24.99,cat:"Juice & More",emoji:"🥛",code:"6001133",stock:30},
 {id:84,name:"Amasi / Maas 2L",price:39.99,cat:"Juice & More",emoji:"🥛",code:"6001134",stock:20},
];
let cart={}, activeCat="Soft Drinks", orderNo="UQ-"+Math.floor(10000+Math.random()*90000);
let cats=["Soft Drinks","Grocery","Fruits & Vegetables","Water","Juice & More","Electric Equipment"];
let sales=JSON.parse(localStorage.getItem('ricky_sales')||'[]');
function salesTotal(){return sales.reduce((s,x)=>s+x.total,0)}
function enterPOS(){document.getElementById('splash').style.display='none';}
let load=0; let li=setInterval(()=>{load+=20;document.getElementById('loadBar').style.width=load+'%'; if(load>=100){clearInterval(li); setTimeout(enterPOS,400)}},300);
setInterval(()=>{let d=new Date(); document.getElementById('clock').innerText=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+', '+d.toLocaleTimeString()},1000);
document.getElementById('orderNo').innerText="Order "+orderNo+" • Cashier: shai";
function renderCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function setCat(c){activeCat=c;document.getElementById('catTitle').innerText=c;render();}
function render(){
  renderCats();
  let q=(document.getElementById('search').value||"").toLowerCase();
  let list=products.filter(p=>p.cat===activeCat && (p.name.toLowerCase().includes(q)||p.code.includes(q)));
  document.getElementById('grid').innerHTML=list.map(p=>`<div class="card ${cart[p.id]?'sel':''}"><div class="img">${p.emoji}</div><div class="body"><small>ITE${p.code} • Stock: ${p.stock}</small><b>${p.name}</b><div class="price">R${p.price.toFixed(2)}</div><div class="barcode"><div>||| ${p.code} |||</div>Scan this fingerprint</div><button onclick="add(${p.id})">ADD +</button></div></div>`).join('');
  let items=Object.values(cart);
  let sub=items.reduce((s,i)=>s+i.qty*i.price,0);
  let vat=sub*15/115;
  let cash=parseFloat(document.getElementById('cashGiven').value||0);
  document.getElementById('cartItems').innerHTML=items.length?items.map(i=>`<div class="item"><div><b>${i.name}</b><br><small>${i.qty} x R${i.price.toFixed(2)}</small></div><div style="text-align:right"><b>R${(i.qty*i.price).toFixed(2)}</b><div class="qtybtns"><button onclick="chg(${i.id},-1)">-</button><b>${i.qty}</b><button onclick="chg(${i.id},1)">+</button><button class="x" onclick="chg(${i.id},-999)">X</button></div></div></div>`).join(''):"<p style='color:#999;text-align:center'>No items yet.<br>Tap ADD + on left.</p>";
  document.getElementById('total').innerText="R"+sub.toFixed(2);
  document.getElementById('vat').innerText="R "+vat.toFixed(2);
  document.getElementById('change').innerText="R "+Math.max(0,cash-sub).toFixed(2);
  document.getElementById('itemCount').innerText=items.reduce((s,i)=>s+i.qty,0)+" items";
}
function add(id){let p=products.find(x=>x.id===id);cart[id]=cart[id]||{...p,qty:0};cart[id].qty++;render();}
function chg(id,d){if(!cart[id])return; if(d===-999){delete cart[id]} else {cart[id].qty+=d; if(cart[id].qty<=0)delete cart[id]} render();}
function scanCode(v){let p=products.find(x=>x.code===v.trim()||x.name.toLowerCase().includes(v.toLowerCase())); if(p){add(p.id);document.getElementById('search').value="";} else {alert("Not found: "+v)}}
function checkout(){
  let items=Object.values(cart); if(!items.length){alert("Cart is empty");return;}
  let sub=items.reduce((s,i)=>s+i.qty*i.price,0);
  let pay=document.getElementById('payMethod').value;
  let cash=parseFloat(document.getElementById('cashGiven').value||0);
  let change=Math.max(0,cash-sub);
  let now=new Date().toLocaleString();
  sales.push({time:now,total:sub}); localStorage.setItem('ricky_sales',JSON.stringify(sales));
  let receipt=document.getElementById('receipt'); receipt.style.display="block";
  receipt.innerHTML=`<div style="max-width:320px;margin:auto;text-align:center;font-family:monospace"><img src="store-logo.png" style="width:90px;height:90px;border-radius:50%;object-fit:cover;"><div style="font-size:22px;font-weight:900;color:#6B0F1A">RICKY'S</div><div style="letter-spacing:3px;color:#B8962E;font-size:11px">GROCERY STORE</div><p>Mbombela<br>${now}<br>Order ${orderNo} • ${pay}</p><hr>${items.map(i=>`<div style="display:flex;justify-content:space-between;text-align:left"><span>${i.qty} x ${i.name}</span><b>R ${(i.qty*i.price).toFixed(2)}</b></div>`).join('')}<hr><div style="display:flex;justify-content:space-between"><b>TOTAL</b><b>R ${sub.toFixed(2)}</b></div><div style="display:flex;justify-content:space-between"><span>Cash Given</span><span>R ${cash.toFixed(2)}</span></div><div style="display:flex;justify-content:space-between"><span>Change</span><span>R ${change.toFixed(2)}</span></div><p>Thank you for shopping at Ricky's!<br>*** Please come again ***</p></div>`;
  window.print(); cart={};document.getElementById('cashGiven').value="";orderNo="UQ-"+Math.floor(10000+Math.random()*90000);document.getElementById('orderNo').innerText="Order "+orderNo+" • Cashier: shai";render(); setTimeout(()=>receipt.style.display="none",500);
}
function dayEnd(){alert("DAY END\nTotal Sales Today: R "+salesTotal().toFixed(2)+"\nSales: "+sales.length); sales=[]; localStorage.removeItem('ricky_sales');}
render();
</script>
</body>
</html>
